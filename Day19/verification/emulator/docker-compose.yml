# Day 19 -- the Service Bus emulator, for capturing evidence by hand.
#
# The test suite starts its own containers through Testcontainers; this file is
# for the manual exercise, where you want a broker that outlives a test run so
# you can watch the DLQ fill up and take a screenshot of it.
#
# Both services share one network on purpose: the emulator connects to SQL
# Server from inside its own container, so SQL_SERVER must be a name that
# resolves there. Pointing it at localhost points it at itself.
#
#   docker compose -f Day19/verification/emulator/docker-compose.yml up -d
#   docker compose -f Day19/verification/emulator/docker-compose.yml down -v
#
# The topology is mounted from the test project's emulator-config.json rather
# than copied here. One file, one topology: a copy would drift, and the copy
# that drifts is always the one nobody runs.
#
# Neither credential below is a secret: the SA password is chosen here for a
# throwaway container, and SAS_KEY_VALUE is the emulator's one well-known key.
services:
  emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: quotes-servicebus-emulator
    depends_on:
      - sqledge
    ports:
      - "5672:5672"   # AMQP (TCP only -- the emulator does not do WebSockets)
      - "5300:5300"   # health / management
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Th!nkSch001Local#"
    volumes:
      - "../../../Day7/piece2/Quotes.Tests.Integration.ServiceBus/emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    networks:
      - servicebus

  sqledge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: quotes-servicebus-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Th!nkSch001Local#"
    networks:
      - servicebus

networks:
  servicebus:
