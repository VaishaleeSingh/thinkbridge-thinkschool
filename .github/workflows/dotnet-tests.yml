name: dotnet-tests

# Runs the Quotes API's integration test suite on every push and pull
# request. Day3/piece2 is the current, canonical version of the project
# (Day1/Day2 are earlier snapshots kept around for history), so that is
# the one CI builds and tests.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (integration tests: QuotesApi.Tests)
        run: dotnet restore Day3/piece2/QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Build (integration tests: QuotesApi.Tests)
        run: dotnet build Day3/piece2/QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore --configuration Release

      - name: Test (integration tests: QuotesApi.Tests)
        run: dotnet test Day3/piece2/QuotesApi.Tests/QuotesApi.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      # Separate project, separate steps: unit tests have no HTTP/host
      # bootstrapping (no WebApplicationFactory), so they build and run
      # independently of the integration suite above.
      - name: Restore (unit tests)
        run: dotnet restore Day3/piece2/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj

      - name: Build (unit tests)
        run: dotnet build Day3/piece2/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-restore --configuration Release

      - name: Test (unit tests)
        run: dotnet test Day3/piece2/Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      # A third, separate project: Quotes.Tests.Integration also uses
      # WebApplicationFactory (same as QuotesApi.Tests above), but boots
      # the app against a fresh, isolated in-memory SQLite database and
      # a FakeClock per test, instead of the real on-disk quotes.db.
      - name: Restore (integration tests: Quotes.Tests.Integration)
        run: dotnet restore Day3/piece2/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Build (integration tests: Quotes.Tests.Integration)
        run: dotnet build Day3/piece2/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-restore --configuration Release

      - name: Test (integration tests: Quotes.Tests.Integration)
        run: dotnet test Day3/piece2/Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      # A fourth, separate project: Quotes.Tests.Integration.SqlServer
      # boots the same real app via WebApplicationFactory, but against a
      # real, containerized SQL Server 2022 instance (via Testcontainers)
      # instead of in-memory SQLite -- catching collation, transaction
      # isolation, and datetime-precision bugs the SQLite-backed suite
      # above structurally cannot see. GitHub's ubuntu-latest runners have
      # Docker running by default, so Testcontainers needs no extra setup
      # here; the first run on a given runner pulls the SQL Server image
      # (~5 min), and that layer is reused by later jobs on the same
      # runner within Docker's local cache.
      - name: Restore (integration tests: Quotes.Tests.Integration.SqlServer)
        run: dotnet restore Day3/piece2/Quotes.Tests.Integration.SqlServer/Quotes.Tests.Integration.SqlServer.csproj

      - name: Build (integration tests: Quotes.Tests.Integration.SqlServer)
        run: dotnet build Day3/piece2/Quotes.Tests.Integration.SqlServer/Quotes.Tests.Integration.SqlServer.csproj --no-restore --configuration Release

      - name: Test (integration tests: Quotes.Tests.Integration.SqlServer)
        run: dotnet test Day3/piece2/Quotes.Tests.Integration.SqlServer/Quotes.Tests.Integration.SqlServer.csproj --no-build --configuration Release --logger "console;verbosity=normal"
