<div class="auth">
  <div class="auth__toolbar">
    <app-button
      variant="ghost"
      size="sm"
      [ariaLabel]="themeActionLabel()"
      (pressed)="theme.toggle()"
    >
      @if (theme.nextPreference() === 'dark') {
        <svg
          class="theme-toggle__icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      } @else {
        <svg
          class="theme-toggle__icon"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
          <path
            d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      }
    </app-button>
  </div>

  <main class="auth__panel" id="main-content">
    <div class="auth__brand">
      <span class="auth__mark" aria-hidden="true"></span>
      <span>Quotes</span>
    </div>

    <router-outlet />
  </main>
</div>
