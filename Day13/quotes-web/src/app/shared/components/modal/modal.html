<!--
  eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus --
  Both rules are suppressed deliberately, and only for this element.

  click-events-have-key-events: its premise is that a click handler needs a
  keyboard equivalent, and here it has one. This handler ONLY implements
  click-outside-to-dismiss; Escape (handled natively by <dialog>) and the
  always-focusable close button are the keyboard paths to the same outcome.
  Adding a keydown handler to a backdrop would be a second, worse Escape.

  interactive-supports-focus: it wants a tabindex on anything with a click
  handler. A <dialog> opened with showModal() is focused by the browser and traps
  focus inside itself -- giving it a tabindex would insert the backdrop into the
  tab order as a phantom stop with nothing to activate.
-->
<dialog
  #dialog
  class="dialog"
  [class.dialog--sm]="size() === 'sm'"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
  (close)="onClose()"
  (click)="onBackdropClick($event)"
>
  <!--
    The panel is a child of the <dialog> rather than the dialog itself, so the
    dialog element can be the full-viewport backdrop that the click test above
    depends on.
  -->
  <div class="dialog__panel">
    <header class="dialog__header">
      <h2 class="dialog__title" [id]="titleId">{{ title() }}</h2>

      <app-button
        variant="ghost"
        size="sm"
        ariaLabel="Close dialog"
        [disabled]="busy()"
        (pressed)="requestClose()"
      >
        <span aria-hidden="true">&#x2715;</span>
      </app-button>
    </header>

    <div class="dialog__body">
      <ng-content />
    </div>

    <!--
      A named slot rather than a `footer` input: the actions are buttons with
      their own loading and disabled state, which no string input could carry.
    -->
    <footer class="dialog__footer">
      <ng-content select="[modalFooter]" />
    </footer>
  </div>
</dialog>
